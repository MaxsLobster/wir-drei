<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wir drei</title>
<style>
:root{--panel:rgba(14,15,22,.74);--ink:#ece6d8;--ink-soft:rgba(236,230,216,.62);--line:rgba(236,230,216,.14);--gold:#e8a838;--chip:rgba(236,230,216,.08)}
html,body{margin:0;height:100%;background:#0b0c10;color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* Ausstellungsmodus (Standard): nur das Bild, keine Steuerung, kein Mauszeiger, keine Berührungsgesten. Test-Modus mit ?dev=1 */
body:not(.dev){cursor:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body:not(.dev) #panel,body:not(.dev) #fps{display:none}
body.clean #panel,body.clean #fps{opacity:0;pointer-events:none}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,calc(100% - 20px));margin-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--panel);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:20px;padding:12px 14px 10px;transition:opacity .4s;max-height:70vh;overflow:auto}
#readout{font-size:13px;line-height:1.45;margin:0 2px 6px;color:var(--ink);white-space:pre-wrap}
#readout .cel{color:var(--gold)}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:8px 2px 4px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 13px/1 Figtree,system-ui,sans-serif;padding:8px 11px;border-radius:10px;cursor:pointer}
.row button.on{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:11px;color:var(--ink-soft);margin:8px 2px 0}
#fps{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;font:600 12px/1.35 Figtree,system-ui,sans-serif;color:#f1ead9;background:rgba(0,0,0,.5);padding:5px 9px;border-radius:8px;pointer-events:none;white-space:pre;transition:opacity .4s}
</style>
</head>
<body>
<canvas id="c" aria-label="Wir drei – lebendes Pixelbild mit Uhr"></canvas>
<div id="fps"></div>
<div id="panel">
  <div id="readout">…</div>
  <div class="lbl">Zeit</div>
  <div class="row"><button id="now" class="on">Jetzt</button><button id="play">Zeitraffer</button><button id="cd8">🎒 8:00 Kindergarten</button><button id="cd19">🌙 19:00 Schlafen</button><button id="t14">14:00</button><button id="t23">23:00</button></div>
  <div class="lbl">Wetter-Vorschau</div>
  <div class="row" id="wxrow"><button data-wx="echt" class="on">Echt</button><button data-wx="regen">🌧 Regen</button><button data-wx="kalt">🥶 Kalt</button><button data-wx="sonne">☀️ Sonne</button><button data-wx="wind">💨 Wind</button></div>
  <div class="lbl">Tonnen-Vorschau</div>
  <div class="row" id="tnrow"><button data-tonne="" class="on">Echt</button></div>
  <div class="lbl">Szenen</div>
  <div class="row"><button data-scene="pauli">🐕 Pauli jagt die Enten</button><button data-scene="monkey">🐒 Affe</button><button data-scene="butter">🦋 Schmetterlinge</button><button data-scene="rain">🌈 Regenbogen + Einhorn</button><button data-scene="night">🌙 Gute Nacht</button><button data-scene="hat">👒 Hut lüften</button><button data-scene="ducks">🦆 Enten</button></div>
  <div class="lbl">Wir drei</div>
  <div class="row"><button data-fam="hop">🦘 Valerie hüpft</button><button data-fam="korb">🧺 Anna rückt den Korb</button><button data-fam="stange">🎋 Max wippt die Stange</button></div>
  <div class="hint">Ohne ?dev=1: 3 Sekunden aufs Bild drücken blendet diese Leiste ein und aus. Mit ?dev=1: Tipp aufs Bild blendet sie aus. Zeit simulieren mit ?t=2026-12-24T17:30, Wetter erzwingen mit ?wetter=regen|kalt|sonne|wind.</div>
</div>
<script>
// =====================================================================
//  Wir drei – lebendes Pixelbild für den Muse Frame
//  Aufbau wie Lichtzeit: eine Datei, Einstellungen in config.json, Ausstellungsmodus als Standard, Test-Modus mit ?dev=1
// =====================================================================

// ---------- Grundlagen ----------
const W=540,H=960,SEE_OBEN=170,SEE_UNTEN=240;   // Foto-Koordinaten (9:16): alle Positionen im Bild rechnen darin, unabhängig vom Raster. Der See liegt etwa zwischen y=170 und 240
// Himmelsgrenze über dem Vulkan, alle 12 Foto-Pixel gemessen: darüber Himmel mit Wolken, darunter der Vulkan
const VULKAN=[166,166,159,149,138,139,135,125,116,108,111,98,92,85,81,82,72,72,63,57,51,72,75,75,75,75,76,72,71,70,66,56,62,66,70,76,87,87,92,98,103,110,115,123,131,136];
const vulkanY=x=>{const f=clamp(x,0,W)/12,a=Math.min(Math.floor(f),VULKAN.length-1),b=Math.min(a+1,VULKAN.length-1);return lerp(VULKAN[a],VULKAN[b],f-a)};
const SS=2;                          // das Foto wird mit doppelter Auflösung (1080×1920) abgetastet, damit auch feine Raster saubere Blockmittel bekommen
// Raster: passt sich dem Bildschirm an (wie Lichtzeit). COLS/ROWS = Zellen, CP = Bildschirmpixel je Zelle, GP = Fuge,
// Z = Vergrößerung von Uhr, Temperatur, Symbolen und Lichterkette (ganzzahlig), ZF = Vergrößerung der Figuren (im Verhältnis zum Bild mindestens wie bei 90 Spalten)
let COLS=108,ROWS=180,CP=10,GP=1,Z=1,ZF=1.2;
const rad=Math.PI/180,TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function pixels(img,w,h){const c=cv(w,h),x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);return x.getImageData(0,0,w,h).data}
const env=(h,a,b,fi,fo)=>h<a||h>b?0:Math.min(1,smooth((h-a)/fi),smooth((b-h)/fo));
// aus Lichtzeit übernommen: Bayer-Matrix und Nachtpalette
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const PAL_N=[[6,8,20],[20,28,56],[44,58,100],[96,110,152],[196,204,222]];
const $=id=>document.getElementById(id);

// ---------- Zeit: Wir drei rechnet immer in Berliner Zeit, egal welche Zeitzone das Gerät eingestellt hat (wie Lichtzeit) ----------
const TZ='Europe/Berlin';
let CLOCK_OFF=0,CLOCK_SRC='';
const nowT=()=>Date.now()+CLOCK_OFF;
const TZF=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});
function bParts(T){const o={};for(const p of TZF.formatToParts(T))o[p.type]=+p.value;o.hour%=24;return o;}
// Date, dessen Felder (getHours, getDate …) die Berliner Uhrzeit zum Zeitpunkt T zeigen. Der echte Zeitpunkt steht in .T
function wall(T){const p=bParts(T),ms=((T%1000)+1000)%1000,off=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-(T-ms);
  let d=new Date(T);if(-d.getTimezoneOffset()*6e4!==off)d=new Date(p.year,p.month-1,p.day,p.hour,p.minute,p.second,ms);
  if(d.getHours()!==p.hour||d.getDate()!==p.day){d.getHours=()=>p.hour;d.getMinutes=()=>p.minute;d.getSeconds=()=>p.second;d.getDate=()=>p.day;d.getMonth=()=>p.month-1;d.getFullYear=()=>p.year;d.getDay=()=>new Date(Date.UTC(p.year,p.month-1,p.day)).getUTCDay();}
  d.T=T;return d;}
function fromWall(y,m,d,h=0,mi=0,s=0){const w=Date.UTC(y,m,d,h,mi,s);let T=w;for(let i=0;i<2;i++){const p=bParts(T);T-=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-w;}return T;}
const dayKey=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const hourOf=d=>d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
const fmtHM=T=>{const d=wall(T);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

// Adresse: ?dev=1 Test-Modus, ?t=2026-12-24T17:30 Zeit simulieren, ?wetter=regen|kalt|sonne|wind erzwingen, ?raster=12 ?fps=30 Anzeige
const Q=new URLSearchParams(location.search),DEV=['1','true','ja'].includes(Q.get('dev')),URL_INFO=[];
if(DEV)document.body.classList.add('dev');
function parseT(s){s=s.trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(s);
  if(m)return fromWall(+m[1],m[2]-1,+m[3],m[4]!==undefined?+m[4]:12,m[5]!==undefined?+m[5]:0,m[6]!==undefined?+m[6]:0);
  m=/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(s);if(m){const n=wall(nowT());return fromWall(n.getFullYear(),n.getMonth(),n.getDate(),+m[1],+m[2],+(m[3]||0));}return null;}
let T_SIM=null;{const s=Q.get('t');if(s){const v=parseT(s);if(v===null||isNaN(v))URL_INFO.push('?t='+s+' nicht erkannt');else T_SIM={at:v,dev:Date.now()};}}
let playing=false,playT=0,SPEED=360; // Zeitraffer: ein Tag in 4 Minuten
const curT=()=>playing?playT:T_SIM?T_SIM.at+(Date.now()-T_SIM.dev):nowT();
function simAt(T){playing=false;T_SIM={at:T,dev:Date.now()};}

// ---------- Sonne: echter Sonnenstand für den Ort (Formeln wie in Lichtzeit / SunCalc) ----------
let LAT=47.87,LNG=12.43;
const J1970=2440588,J2000=2451545,E=rad*23.4397,J0=0.0009;
const toDays=T=>T/864e5-0.5+J1970-J2000,fromJulian=j=>(j+0.5-J1970)*864e5;
const sunM=d=>rad*(357.5291+0.98560028*d);
const sunL=M=>M+rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M))+rad*102.9372+Math.PI;
const DEC=(l,b)=>Math.asin(Math.sin(b)*Math.cos(E)+Math.cos(b)*Math.sin(E)*Math.sin(l));
const RA=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(E)-Math.tan(b)*Math.sin(E),Math.cos(l));
const SID=(d,lw)=>rad*(280.16+360.9856235*d)-lw;
function sunPos(T){const lw=rad*-LNG,phi=rad*LAT,d=toDays(T),M=sunM(d),L=sunL(M),dec=DEC(L,0),ra=RA(L,0),Hh=SID(d,lw)-ra;
  return{alt:Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(Hh))/rad,
         az:Math.atan2(Math.sin(Hh),Math.cos(Hh)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))/rad};} // az: 0 = Süden, negativ = Osten
// Mond wie bei suncalc: Höhe, Richtung (0 = Süden, negativ = Osten) und beleuchteter Anteil, für den Mondstrahl auf dem See
function moonCoords(d){const L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),Fm=rad*(93.272+13.229350*d),l=L+rad*6.289*Math.sin(M),b=rad*5.128*Math.sin(Fm);return{ra:RA(l,b),dec:DEC(l,b),dist:385001-20905*Math.cos(M)}}
function moonPos(T){const lw=rad*-LNG,phi=rad*LAT,d=toDays(T),c=moonCoords(d),Hh=SID(d,lw)-c.ra;
  return{alt:Math.asin(Math.sin(phi)*Math.sin(c.dec)+Math.cos(phi)*Math.cos(c.dec)*Math.cos(Hh))/rad,az:Math.atan2(Math.sin(Hh),Math.cos(Hh)*Math.sin(phi)-Math.tan(c.dec)*Math.cos(phi))/rad}}
function moonFrac(T){const d=toDays(T),M=sunM(d),L=sunL(M),sd=DEC(L,0),sr=RA(L,0),m=moonCoords(d),sdist=149598000;
  const ph=Math.acos(Math.sin(sd)*Math.sin(m.dec)+Math.cos(sd)*Math.cos(m.dec)*Math.cos(sr-m.ra)),inc=Math.atan2(sdist*Math.sin(ph),m.dist-sdist*Math.cos(ph));return(1+Math.cos(inc))/2}
// Sonnenauf- und -untergang (Sonnenhöhe -0,833°) für den Berliner Kalendertag; Ergebnis je Tag zwischengespeichert
const SUN_CACHE=new Map();
function sunTimesDay(y,m,d){const k=y*10000+(m+1)*100+d;let v=SUN_CACHE.get(k);if(v)return v;
  const noon=fromWall(y,m,d,12),lw=rad*-LNG,phi=rad*LAT,dd=toDays(noon),n=Math.round(dd-J0-lw/TAU),ds=J0+lw/TAU+n,M=sunM(ds),L=sunL(M),dec=DEC(L,0);
  const Jnoon=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  const w=Math.acos((Math.sin(-0.833*rad)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  let rise,set;if(isNaN(w)){rise=fromWall(y,m,d,6);set=fromWall(y,m,d,18);}else{const Jset=J2000+(J0+(w+lw)/TAU+n)+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);set=fromJulian(Jset);rise=fromJulian(Jnoon-(Jset-Jnoon));}
  v={rise,set};if(SUN_CACHE.size>400)SUN_CACHE.clear();SUN_CACHE.set(k,v);return v;}
function sunTimes(d){const t=sunTimesDay(d.getFullYear(),d.getMonth(),d.getDate()),p=sunTimesDay(d.getFullYear(),d.getMonth(),d.getDate()-1),n=sunTimesDay(d.getFullYear(),d.getMonth(),d.getDate()+1);
  return{rise:t.rise,set:t.set,prevSet:p.set,nextRise:n.rise};}

// ---------- Einstellungen (config.json) ----------
// Fehlt ein Eintrag, gilt der eingebaute Standard. Ist einer fehlerhaft, ebenfalls, mit Hinweis in der Info-Zeile (?dev=1).
let ORT='Chiemsee',CFG_INFO='',started=false;
let COUNTDOWNS=[{name:'Kindergarten',von:480,bis:495,tage:[1,2,3,4,5],stil:'bunt'},{name:'Schlafen',von:1140,bis:1155,tage:[0,1,2,3,4,5,6],stil:'sanft'}];
let GUTE_NACHT=1140;
const TONNEN_FARBEN={blau:{c:[52,108,204],lid:[36,82,166],d:[44,94,184]},grau:{c:[78,80,86],lid:[46,48,52],d:[66,68,74]},gelb:{c:[226,186,40],lid:[180,142,24],d:[206,166,32]},braun:{c:[124,84,52],lid:[90,58,34],d:[110,72,44]},gruen:{c:[62,138,74],lid:[40,100,52],d:[52,120,62]},schwarz:{c:[46,46,50],lid:[26,26,30],d:[38,38,42]},orange:{c:[228,120,40],lid:[180,86,24],d:[208,104,32]}};
let TONNEN=[{name:'Papier',farbe:'blau',start:'2026-11-05',alle:28,versch:[]},{name:'Hausmüll',farbe:'grau',start:'2026-11-11',alle:14,versch:[]}];
let TONNE_AB=360,TONNE_BIS=600;
let SCHW={kalt:5,uv:5,regen:50,regenH:6};
let SZENEN={an:true,min:10,max:15,enten:6};
let WETTER={echt:true,min:15};
let ANZ={raster_px:0,max_fps:30},ANZ_SRC={};
let BEWEGUNG={an:true,min:20,max:40,schimmer:true};
const CFG_KEYS=['ort','countdowns','gute_nacht','tonnen','tonnen_anzeige','schwellen','szenen','wetter','anzeige','bewegung'];
const TAGK={so:0,mo:1,di:2,mi:3,do:4,fr:5,sa:6};
const pUhr=v=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(v).trim());if(!m)return null;const a=+m[1],b=+m[2];return b<60&&a*60+b<=1440?a*60+b:null;};
const pISO=v=>{const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(v).trim());if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;return{y,m:mo-1,d};};
const pZahl=(a,b,ganz)=>v=>typeof v==='number'&&isFinite(v)&&v>=a&&v<=b&&(!ganz||Number.isInteger(v))?v:null;
const pText=v=>typeof v==='string'&&v.trim()?v.trim():null;
const pJaNein=v=>typeof v==='boolean'?v:null;
const pTage=v=>{if(!Array.isArray(v))return null;const out=[];for(const t of v){const k=typeof t==='string'?TAGK[t.trim().toLowerCase().slice(0,2)]:(typeof t==='number'&&t>=0&&t<=6?t:undefined);if(k===undefined)return null;if(!out.includes(k))out.push(k);}return out;};
const pFarbe=v=>{if(typeof v!=='string')return null;const s=v.trim().toLowerCase().replace('ü','ue');if(TONNEN_FARBEN[s])return s;const m=/^#([0-9a-f]{6})$/.exec(s);if(!m)return null;const n=parseInt(m[1],16),c=[n>>16&255,n>>8&255,n&255];TONNEN_FARBEN[s]={c,lid:c.map(x=>x*.7|0),d:c.map(x=>x*.86|0)};return s;};
function applyConfig(j){const bad=[],notes=[],obj=v=>!!v&&typeof v==='object'&&!Array.isArray(v),or=(v,d)=>v!==undefined?v:d;
  const take=(v,parse,name)=>{if(v===undefined)return undefined;const p=parse(v);if(p===null){bad.push(name);return undefined;}return p;};
  const part=(k,fn)=>{if(j[k]===undefined)return;if(!obj(j[k])){bad.push(k);return;}fn(j[k]);};
  if(!obj(j)){CFG_INFO='config.json hat nicht das erwartete Format, Standardwerte aktiv';return;}
  part('ort',o=>{ORT=or(take(o.name,pText,'ort.name'),ORT);LAT=or(take(o.breite,pZahl(-90,90),'ort.breite'),LAT);LNG=or(take(o.laenge,pZahl(-180,180),'ort.laenge'),LNG);SUN_CACHE.clear();});
  if(j.countdowns!==undefined){if(!Array.isArray(j.countdowns))bad.push('countdowns');else{const L=[];j.countdowns.forEach((c,k)=>{const nm='countdowns '+(k+1);if(!obj(c)){bad.push(nm);return;}
    const von=take(c.von,pUhr,nm+' von'),bis=take(c.bis,pUhr,nm+' bis'),tage=take(c.tage,pTage,nm+' tage'),stil=take(c.stil,v=>['bunt','sanft'].includes(v)?v:null,nm+' stil');
    if(von===undefined||bis===undefined||bis<=von){if(von!==undefined&&bis!==undefined)bad.push(nm+' (bis liegt nicht nach von)');return;}
    L.push({name:or(take(c.name,pText,nm+' name'),'Countdown '+(k+1)),von,bis,tage:tage||[0,1,2,3,4,5,6],stil:stil||(von>=720?'sanft':'bunt')});});COUNTDOWNS=L;}}
  GUTE_NACHT=or(take(j.gute_nacht,pUhr,'gute_nacht'),GUTE_NACHT);
  if(j.tonnen!==undefined){if(!Array.isArray(j.tonnen))bad.push('tonnen');else{const L=[];j.tonnen.forEach((t,k)=>{const nm='tonnen '+(k+1);if(!obj(t)){bad.push(nm);return;}
    const start=take(t.erster_termin,v=>pISO(v)?String(v).trim():null,nm+' erster_termin'),alle=take(t.alle_tage,pZahl(1,366,true),nm+' alle_tage');if(start===undefined||alle===undefined)return;
    const versch=[];if(t.verschiebungen!==undefined){if(!Array.isArray(t.verschiebungen))bad.push(nm+' verschiebungen');else t.verschiebungen.forEach((v,q)=>{if(obj(v)&&pISO(v.von)&&pISO(v.auf))versch.push({von:String(v.von).trim(),auf:String(v.auf).trim()});else bad.push(nm+' verschiebungen '+(q+1));});}
    L.push({name:or(take(t.name,pText,nm+' name'),'Tonne '+(k+1)),farbe:or(take(t.farbe,pFarbe,nm+' farbe'),'grau'),start,alle,versch});});TONNEN=L;}}
  part('tonnen_anzeige',o=>{TONNE_AB=or(take(o.ab_vortag,pUhr,'tonnen_anzeige ab_vortag'),TONNE_AB);TONNE_BIS=or(take(o.bis_abholtag,pUhr,'tonnen_anzeige bis_abholtag'),TONNE_BIS);});
  part('schwellen',s=>{SCHW={kalt:or(take(s.kalt_unter_grad,pZahl(-30,40),'schwellen kalt_unter_grad'),SCHW.kalt),uv:or(take(s.uv_ab,pZahl(0,15),'schwellen uv_ab'),SCHW.uv),regen:or(take(s.regen_ab_prozent,pZahl(0,100),'schwellen regen_ab_prozent'),SCHW.regen),regenH:or(take(s.regen_stunden,pZahl(1,8,true),'schwellen regen_stunden'),SCHW.regenH)};});
  part('szenen',s=>{SZENEN.an=or(take(s.an,pJaNein,'szenen an'),SZENEN.an);SZENEN.enten=or(take(s.enten_alle_minuten,pZahl(1,240),'szenen enten_alle_minuten'),SZENEN.enten);
    if(s.gag_alle_minuten!==undefined){const g=s.gag_alle_minuten;if(Array.isArray(g)&&g.length===2&&pZahl(1,240)(g[0])!==null&&pZahl(1,240)(g[1])!==null&&g[1]>=g[0]){SZENEN.min=g[0];SZENEN.max=g[1];}else bad.push('szenen gag_alle_minuten');}});

function tonneTage(t,d){const base=Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),s0=isoDays(t.start),out=new Set();
  const k0=Math.floor((base-60-s0)/t.alle),k1=Math.ceil((base+60-s0)/t.alle);
  for(let k=k0;k<=k1;k++){const day=s0+k*t.alle,dt=new Date(day*864e5),key=dt.getUTCFullYear()*10000+(dt.getUTCMonth()+1)*100+dt.getUTCDate();
    const v=t.versch.find(v=>isoKey(v.von)===key);out.add(v?isoKey(v.auf):key);}
  return out;}

  const min=d.getHours()*60+d.getMinutes(),heute=dayKey(d),morgen=dayKey(wall(fromWall(d.getFullYear(),d.getMonth(),d.getDate()+1,12)));
  for(const t of TONNEN){const tage=tonneTage(t,d);if(tage.has(heute)&&min<TONNE_BIS)return{t,heute:true};if(tage.has(morgen)&&min>=TONNE_AB)return{t,heute:false};}return null;}

// ---------- Szenen-Ablauf: immer nur ein Gag, Uhr und Symbole bleiben frei ----------
const EV=[];
const SCN={pauli:{dur:17,name:'Pauli jagt die Enten'},monkey:{dur:23,name:'Affe klaut ein Reisbündel'},butter:{dur:21,name:'Schmetterlinge besuchen Valerie'},hat:{dur:7,name:'Valerie und Max lüften die Hüte'},rain:{dur:40,name:'Regenbogen mit Einhorn'},night:{dur:32,name:'Gute Nacht'},ducks:{dur:24,name:'Laufenten mit Küken'}};
const ROT=['pauli','monkey','butter','hat'];
let nextGag=45,gagIdx=0,nextDucks=20,nextShoot=0,lastMin=null;
function start(type,ts){if(EV.some(e=>e.type===type))return;if(type==='ducks'&&EV.some(e=>e.type==='pauli'))return;if(type==='pauli')for(let i=EV.length-1;i>=0;i--)if(EV[i].type==='ducks')EV.splice(i,1);if(type==='night')for(let i=EV.length-1;i>=0;i--)if(EV[i].type!=='ducks')EV.splice(i,1);EV.push({type,t0:ts})}
function running(type,ts){const e=EV.find(e=>e.type===type);return e?ts-e.t0:-1}
function schedule(ts,L,d){
  // Gute-Nacht-Moment beim Überschreiten der eingestellten Uhrzeit (auch im Sommer, wenn es noch hell ist)
  const min=d.getHours()*60+d.getMinutes();if(lastMin!==null&&min>=lastMin&&lastMin<GUTE_NACHT&&min>=GUTE_NACHT&&min<GUTE_NACHT+30)start('night',ts);lastMin=min;
  for(let i=EV.length-1;i>=0;i--)if(ts-EV[i].t0>SCN[EV[i].type].dur)EV.splice(i,1);
  if(!SZENEN.an)return;
  if(ts>=nextGag&&!EV.some(e=>e.type!=='ducks')){
    if(L.alt>3){const t=ROT[gagIdx++%ROT.length];start(t,ts);nextGag=ts+SCN[t].dur+lerp(SZENEN.min,SZENEN.max,Math.random())*60}
    else nextGag=ts+30}
  if(ts>=nextDucks){if(L.sunUp&&!EV.some(e=>e.type==='night'))start('ducks',ts);nextDucks=ts+SZENEN.enten*60}}

// ---------- Lichtstrahl auf dem See wie bei Lichtzeit (L_beam): tagsüber unter der Sonne, nachts unter dem Mond, glitzert, nur innerhalb der See-Maske ----------
// Blick nach Süden: Osten links, Westen rechts. Richtung (Azimut in Grad, 0 = Süden) in Foto-x
const skyX=az=>clamp(W/2+az/90*250,24,W-24);

  if(dk>0)out.push({x:skyX(sun.az),str:dk*(.32+.4*smooth(sun.alt/25)),col:mix([255,180,110],[255,245,225],smooth(sun.alt/15)),mond:false});
  if(dk<1){const m=moonPos(T),fr=moonFrac(T),up=smooth((m.alt+1)/5);
    // Steht der Mond am Himmel, liegt der Strahl unter ihm. Sonst wie bei Lichtzeit ein schwächerer Mondlichtstrahl, der mit der Nacht von links nach rechts wandert. Die Stärke folgt der Mondphase.
    const a0=T<ST.rise?ST.prevSet:ST.set,b0=T<ST.rise?ST.rise:ST.nextRise,p=clamp((T-a0)/(b0-a0),0,1);
    out.push({x:lerp(lerp(40,500,p),skyX(m.az),up),str:(1-dk)*lerp(.26+.2*fr,.3+.4*fr,up),col:[212,222,242],mond:true})}

    for(const c of S.lake){const u=c.u,hw=9+u*55+u*u*55,rw=.4+.6*Math.abs(Math.sin(c.j*7.13)),wv=hw*rw,jx=Math.sin(c.j*12.9+ts*.6*sh)*wv*.3*(.3+u),

      let a=k*b.str*((1-u*.3)*(.12*soft+.3*strip*tw));S.add(c.k,b.col,a);

      if(v>.82&&strip>.15)S.glow(c.i,c.j,mix(b.col,[255,255,255],.5),Math.min(1,(v-.82)/.18*strip*b.str*1.7*Math.sqrt(k)))}}}

// ---------- Licht der Tageszeit nach echtem Sonnenstand ----------
const NACHT=[.22,.25,.38],NACHT_DAEMMER=[.42,.43,.58];
function lightAt(T,d){const s=sunPos(T),a=s.alt,morning=s.az<0,ST=sunTimes(d);
  const warm=morning?[1.12,.86,.72]:[1.14,.9,.74],dusk=morning?[1.08,.8,.74]:[1.0,.72,.7];
  let tint,night;
  // Nacht: dunkles, wenig gesättigtes Blau wie bei Lichtzeit (die Entsättigung und der Dither folgen in der Engine)
  if(a>=10){tint=[1,1,1];night=0}
  else if(a>=0){const k=smooth(a/10);tint=mix(warm,[1,1,1],k);night=lerp(.2,0,smooth(a/5))}
  else if(a>=-6){const k=smooth(-a/6);tint=mix(dusk,NACHT_DAEMMER,k);night=lerp(.2,.75,k)}
  else if(a>=-12){const k=smooth((-a-6)/6);tint=mix(NACHT_DAEMMER,NACHT,k);night=lerp(.75,1,k)}
  else{tint=NACHT;night=1}
  // Lichtwellen gehen von der Sonne aus, nachts vom Mondstrahl
  const sunUp=T>=ST.rise&&T<=ST.set,beams=strahlen(T,ST,s);let lx,ly;
  if(sunUp){lx=skyX(s.az);ly=lerp(165,40,smooth(a/35))}else{lx=beams.length?beams[beams.length-1].x:W/2;ly=60}
  return{tint,night,lx,ly,amp:lerp(.2,.1,night),alt:a,sunUp,ST,beams}}

// ---------- Wir bewegen uns mit (aus der Vorlage): Wind auf Annas Haaren, Korbgras, Reisbündeln und Valeries Kleid, kleine Bewegungen, Schimmer ----------
// Positionen in Foto-Koordinaten. Verschiebungen sind in Vorlagen-Zellen (6 Foto-Pixel) angegeben und werden mit m = 6·s auf das aktuelle Raster gebracht. Gesichter bleiben ruhig.
const FAM={hop:-1,korb:-1,stange:-1,next:0,idx:0};
function famSetup(S){const B=S.B;if(!B.anna||!B.max||!B.valerie||!S.plate)return null;
  const who=(x,y)=>{const v=S.at(B.valerie,x,y)*255,a=S.at(B.anna,x,y)*255,m=S.at(B.max,x,y)*255;if(v>110)return'v';if(a>110&&a>=m)return'a';if(m>110)return'm';return null};
  const P={a:[],m:[],v:[]},C=S.cols;
  for(let j=0;j<S.rows;j++)for(let i=0;i<C;i++){const k=j*C+i;if(!S.fam[k])continue;const x=S.px(i+.5),y=S.py(j+.5),w=who(x,y);if(!w)continue;
    const c={i,j,k,x,y,tag:''};
    if(w==='a'){if(y<212)c.tag='gras';else if(x>98&&x<218&&y>330&&y<458&&(((x-160)/30)**2+((y-386)/42)**2)>1)c.tag='haar';else if(y<335&&x>40&&x<262)c.tag='korb'}
    if(w==='m'){if(x>190&&x<260&&y>368&&y<456)c.tag='buendelL';else if(x>384&&x<476&&y>368&&y<460)c.tag='buendelR';else if(y<380)c.tag='oben'}
    if(w==='v'){if(y>752&&y<872)c.tag='kleid'}
    P[w].push(c)}
  return P}
function famMotion(S,ts){const P=S.parts;if(!P||!BEWEGUNG.an)return;const cr=S.cr,C=S.cols,R=S.rows,base=S.base,pl=S.plate,w=WX_wind(),m=6*S.s;
  // kleine Bewegungen im Wechsel (Valerie hüpft, Anna rückt den Korb, Max wippt die Stange), alle 20–40 s laut config.json, nicht während eines Gags
  if(!FAM.next)FAM.next=ts+lerp(BEWEGUNG.min,BEWEGUNG.max,Math.random());
  if(ts>FAM.next){if(EV.some(e=>e.type!=='ducks'&&e.type!=='night'))FAM.next=ts+5;else{const k=['hop','korb','stange'][FAM.idx++%3];FAM[k]=ts;FAM.next=ts+lerp(BEWEGUNG.min,BEWEGUNG.max,Math.random())}}

  const sy=st<1?Math.round(m*(Math.sin(st*Math.PI*2*1.5)>.3?1:0)):0;
  const kick=st<4?Math.exp(-st*.9)*1.6:0,kickK=korb<3?Math.exp(-korb*1.2)*.8:0,affe=running('monkey',ts)>=0;
  const disp=(c,who)=>{let dx=0,dy=0;const t=c.tag;

    if(t==='gras')dx=m*(1.1*w+kickK*2)*Math.sin(ts*1.6+c.x*.02)*Math.pow(clamp((212-c.y)/110,0,1),1.1);
    if((t==='buendelL'||t==='buendelR')&&!(affe&&t==='buendelR')){const L=t==='buendelL',pv=L?[225,365]:[430,365],th=(.05*w+.09*kick)*Math.sin(ts*(L?1.35:1.2)+(L?0:1.3));dx=(c.y-pv[1])*S.s*Math.sin(th)}

    if(who==='v')dy+=vy;

    return[Math.round(dx),Math.round(dy)]};
  // 1) alle bewegten Zellen zuerst mit dem leeren Hintergrund füllen; hebt Anna den Korb, kommt darunter ihr Kopf zum Vorschein, nicht der Himmel
  const moved=[];
  for(const who of['a','m','v'])for(const c of P[who]){const [dx,dy]=disp(c,who);if(dx||dy){moved.push([c,dx,dy]);const o=c.k*3;

  // 3) leichter Schimmer in Kleidung und Haaren (abschaltbar in config.json)

// ---------- Pauli jagt die Enten (aus der Vorlage): Positionen in Foto-Koordinaten, Füße unten mittig ----------
// Figuren werden nach vorne größer (mindestens so groß wie in der Vorlage). Was vorne läuft (y > 860), ist vor uns, was hinten läuft, hinter uns.
const DOG={pal:{B:[178,114,62],b:[150,94,50],D:[118,72,38],W:[178,114,62],K:[16,12,10],P:[236,110,130]},
  runA:["...BB.........","..BBBB........",".DKBBBBBBBBBBB","DDBBBBBBBBBBBB",".PWWBBBBBBBBB.","..WWBbBBBBBb..","..B..B....B..B",".W...W...W...W"],
  runB:["...BB.........","..BBBB........",".DKBBBBBBBBBBB","DDBBBBBBBBBBBB",".PWWBBBBBBBBB.","..WWBbBBBBBb..","...BB.....BB..","...WW.....WW.."],
  sit:["...BB....","..BBBB...",".DKBBB...","DDBBBBB..",".PWWBBBB.","..WWBBBB.","..WWBBBBB",".WW.WBBW."],
  sitW:["...BB....","..BBBB...",".DKBBB...","DDBBBBB..",".PWWBBBB.","..WWBBBBB","..WWBBBB.",".WW.WBBW."]};

const PDUCKS=[{o:0,p:'W',pts:[[4.5,0,530],[8.6,120,890],[11,120,890],[13.5,-90,880]]},{o:42,p:'B',pts:[[4.5,0,530],[8.2,500,905],[11.5,500,905],[14,640,900]]},
  {o:84,p:'W',pts:[[4.5,0,530],[7.5,-80,600]]},{o:126,p:'W',pts:[[4.5,0,530],[8,300,945],[10.5,300,945],[13,-90,940]]}];
function pauliSzene(S,ts){const e=running('pauli',ts);if(e<0)return;

  PDUCKS.forEach((d,q)=>{let x,y,dx=-1,panic=e>=4.5;
    if(!panic){x=walkX(d.o);y=530}else{const p0=[...d.pts];p0[0]=[4.5,walkX(d.o),530];[x,y,dx]=pfad(e,p0);x+=Math.sin(e*9+q)*6*(e<11?1:0);y-=Math.abs(Math.sin(e*14+q))*5*(e<11?1:0)}

// ---------- Das Bild. Alle Positionen in Foto-Koordinaten (540×960), erst beim Zeichnen in Zellen umgerechnet ----------
function build(B){
  const r=rng(5);
  const flies=Array.from({length:28},(_,n)=>({x:lerp(10,530,r()),y:lerp(560,930,r()),ph:r()*6.28,f:lerp(.4,1,r()),ta:n/28*Math.PI*2,tr:lerp(.85,1.1,r())}));

    look:(S,ts)=>{const T=curT(),d=wall(T),L=lightAt(T,d);schedule(ts,L,d);

      const gn=running('night',ts);if(gn>=0){const k=env(gn,0,32,4,6);tint=mix(tint,NACHT_DAEMMER,k*.85);night=Math.max(night,k*.55);amp=lerp(amp,.1,k);lx=lerp(lx,27,k);ly=lerp(ly,123,k)}

        hhmm:String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'),gridCol:night>.5?[8,9,16]:undefined}},

      const regen=(Q,a1,a2,a3)=>{for(const q of Q){const y=(((ts*q.v+q.o)%175)-5)*rows/160,xx=q.x*cols+y*.12+(a3?wx.wind*.004*y:0);S.glow(xx,y,[226,236,255],a1);S.glow(xx-.12,y-1,[226,236,255],a2);if(a3===undefined)S.glow(xx-.24,y-2,[226,236,255],a1*.27)}};

      const gn=running('night',ts),gk=gn>=0?env(gn,9,28,3,4):0;

      const shoot=(t0,x0,y0,x1,y1)=>{const p=(ts-t0)/1.4;if(p<0||p>1.25)return;for(let q=0;q<9;q++){const pp=p-q*.04;if(pp<0||pp>1)continue;S.glowK(ci(lerp(x0,x1,pp)),cj(lerp(y0,y1,pp)),[255,250,230],(1-q/9)*(p>1?1-(p-1)*4:1),2)}};

      else if(n>.6){if(ts>nextShoot+1.6)nextShoot=ts+lerp(12,25,Math.random());const v=(nextShoot*7)%20;if(Math.floor(nextShoot)%2)shoot(nextShoot,538,97+v*.1,466,101+v*.1);else shoot(nextShoot,4+v,94+v*.2,116+v,124+v*.2)}
      // ---- Gute Nacht: der Mond steigt links hinter dem Vulkanhang auf (nur im Himmel sichtbar) ----
      if(gn>=0){const k=env(gn,0,32,1,5),rise=smooth(gn/9),mx=ci(12),my=cj(lerp(176,108,rise)),mc=sz(2.5);
        for(let a=0;a<24;a++){const an=a/24*Math.PI*2;S.glowK(mx+mc+Math.cos(an)*4.2*F,my+mc+Math.sin(an)*4.2*F,[230,230,210],k*.18,2)}

      // ---- tagsüber: Silberreiher, zwei Schmetterlinge im Feld ----
      if(day){
        const e=((ts+6)%26),A=[ci(40),cj(600)],B=[ci(470),cj(470)],hop=27*F;

        else if(e<13){const p=smooth((e-9)/4);S.sprite(Math.floor(e*5)%2?'egUp':'egDn',lerp(A[0],B[0],p),lerp(A[1],B[1],p)-Math.sin(p*Math.PI)*hop+3*F)}

        for(let q=0;q<2;q++){const b=buts[q],bx=ci(120+q*260+90*Math.sin(ts*.27*b.f+b.ph)),by=cj(640+60*Math.sin(ts*.41*b.f+q))+Math.sin(ts*9+q)*.6*F,op=Math.floor(ts*7+q*3)%2;
          S.sprite(op?'fbO':'fbC',bx-sz(1),by-sz(1),1,false,false,1,b.pal)}
      }
      // ---- Laufenten mit trödelndem Küken (hinter uns), von rechts nach links am Wasserrand ----
      const de=running('ducks',ts);if(de>=0){const lead=ci(W+12-de*25.2),row=Math.round(cj(530)),step=Math.floor(de*3.2)%2,dj=row-sz(6)+1;
        [[0,'duck'],[6,'bduck'],[12,'duck'],[18,'duck']].forEach(([o,nm],q)=>S.sprite(nm+((step+q)%2?'A':'B'),lead+o*F,dj));
        const k=de%8,gap=k<6?2+k*1.1:2+8.6*(1-smooth((k-6)/2)),fast=k>=6;S.sprite('kid'+((Math.floor(de*(fast?8:3.2)))%2?'A':'B'),lead+(22+gap)*F,row-sz(3)+1)}
      // ---- Pauli jagt die Enten ----

      // ---- Hut lüften ----

      // ---- Affe klaut ein Reisbündel von Max' Stange und bringt es zurück ----
      const me=running('monkey',ts);if(me>=0){const j0=Math.round(cj(361))-sz(8),xg=Math.round(ci(474)),out=cols+sz(8),lift=Math.round(2*F);let mx,bdx=0,bdy=0,face=-1,walk=true,hop=0;
        if(me<3){mx=lerp(cols+1,xg,smooth(me/3))}
        else if(me<4.4){mx=xg;walk=false;hop=(me>3.5&&me<3.9)?Math.round(F):0}
        else if(me<5.2){mx=xg;walk=false;bdy=Math.round(lift*smooth((me-4.4)/.8))}
        else if(me<8){mx=lerp(xg,out,smooth((me-5.2)/2.8));bdx=mx-xg;bdy=lift;face=1}

        else if(me<18){mx=xg;walk=false;bdy=Math.round(lift*(1-smooth(me-17)))}
        else{mx=lerp(xg,cols+2,smooth((me-18)/3));face=1}
        if(bdx||bdy)S.hat(bundle,bdy,Math.round(bdx));
        const fr=walk&&Math.floor(me*6)%2?'monkB':'monkA',jj=j0-hop;
        S.sprite(fr,mx,jj,1,false,true);const t0=face<0?6:-1,sg=face<0?1:-1,wag=Math.round(Math.sin(me*5));
        S.fput(mx,jj,t0,6,COL.m);S.fput(mx,jj,t0+sg,5,COL.m);S.fput(mx,jj,t0+sg,4+wag,COL.m);S.fput(mx,jj,t0+sg*2,3+wag,COL.m)}
      // ---- Schmetterlinge besuchen Valerie, einer landet auf dem Hut, eine Blüte wächst ----
      const be=running('butter',ts);if(be>=0){const hx=Math.round(ci(HATV.ax)),hy=Math.round(cj(HATV.ay))-Math.round(F);
        buts.forEach((b,q)=>{let bx,by;const lead=q===0;
          const come=smooth(be/4),leave=smooth((be-15)/5),orbit=[hx+(b.ox+Math.sin(be*1.3*b.f+b.ph)*4)*F,hy+(b.oy+Math.cos(be*1.1*b.f+b.ph)*3)*F];
          const startP=[(-6-q*3)*F,(40+q*6)*F],endP=[cols+6*F,(10+q*4)*F];
          let tgt=lead&&be>4&&be<15?[hx,hy]:orbit;bx=lerp(startP[0],tgt[0],come);by=lerp(startP[1],tgt[1],come);bx=lerp(bx,endP[0],leave);by=lerp(by,endP[1],leave);
          const sit=lead&&be>4.5&&be<15,op=sit?(Math.floor(be*1.5)%2):(Math.floor(be*8+q)%2);by+=sit?0:Math.sin(be*9+q)*.6*F;
          S.sprite(op?'butO':'butC',bx-sz(2),by-sz(2),1,false,true,1,b.pal)});
        const fk=env(be,5,16,1.2,1.5);if(fk>0){const fx=Math.round(ci(HATV.ax+44)),fy=Math.round(cj(HATV.brim-14))-sz(2,2),grow=Math.ceil(fk*5);
          S.sprite(SPR.flower.map((row,k)=>k<5-grow?'...':row),fx,fy,fk,false,true,2)}}
      // ---- Regen, Regenbogen, Einhorn mit Glitzerspur ----
      const re=running('rain',ts);if(re>=0){const ri=env(re,0,13,2,3);
        if(ri>0)regen(drops,.75*ri,.45*ri);
        const bk=env(re,11,39,3,4);if(bk>0){const cx=cols/2,cy=cj(672),R0=408*S.s,bw=Math.max(1,Math.round(F)),jTop=Math.max(0,Math.floor(cy-R0-1));
          for(let j=jTop;j<Math.min(rows,Math.ceil(cy));j++)for(let i=0;i<cols;i++){const dd=Math.hypot(i+.5-cx,j+.5-cy),b=Math.floor((R0-dd)/bw);if(b>=0&&b<7)S.put(i,j,RAINBOW[b],.5*bk,true)}
          const ue=re-17;if(ue>=0&&ue<10){const ux=lerp(-sz(16),cols+2,ue/10),dx=ux+sz(3)-cx,uy=cy-Math.sqrt(Math.max(0,(R0+2*F)**2-dx*dx))-sz(6)+(Math.floor(ue*5)%2?0:-1);
            S.sprite(Math.floor(ue*5)%2?'uniA':'uniB',ux,uy-sz(6),1,false,true,2);sparkle.push({x:ux+F,y:uy+2*F,t:ts,c:RAINBOW[Math.floor(ue*14)%7]})}
          sparkle=sparkle.filter(s=>ts-s.t<1.2);for(const s of sparkle)S.glow(s.x+Math.sin(s.t*40)*.8,s.y+(ts-s.t)*2*F,s.c,(1-(ts-s.t)/1.2)*.9)}}
      // ---- zuletzt: Uhr, Temperatur, Symbole, Lichterkette (immer obenauf) ----
      const nn=clamp(n*1.2,0,1);clock(S,L,ts);
      const tsr=tempStr(wx);text(S,tsr,3,6,nn);miniRow(S,needs(L,wx,d),3+tsr.length*4+1,10,nn,ts);
      lichterkette(S,ts,countdownJetzt(d),nn);
    }});}

// ---------- Entschlüsseln: Schlüssel nur im Adress-Fragment (#k=…), das nie an den Server geht ----------
const b64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
function loadBytes(bytes,typ){return new Promise((res,rej)=>{const url=URL.createObjectURL(new Blob([bytes],{type:typ})),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);res(im)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Bild nicht lesbar'))};im.src=url})}
async function entschluesseln(){
  const m=/[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash);if(!m)throw new Error('kein Schlüssel in der Adresse (#k=…)');
  const raw=b64u(m[1]);if(raw.length!==32)throw new Error('Schlüssel hat die falsche Länge');
  if(!(crypto&&crypto.subtle))throw new Error('Browser kann nicht entschlüsseln (keine sichere Verbindung?)');
  const r=await fetch('familie.enc');if(!r.ok)throw new Error('familie.enc fehlt (HTTP '+r.status+')');
  const buf=new Uint8Array(await r.arrayBuffer());if(buf.length<36||String.fromCharCode(...buf.subarray(0,8))!=='WIRDREI1')throw new Error('familie.enc hat ein unbekanntes Format');
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  let pt;try{pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.subarray(8,20)},key,buf.subarray(20)));}catch(e){throw new Error('Schlüssel passt nicht');}
  const hl=((pt[0]<<24)|(pt[1]<<16)|(pt[2]<<8)|pt[3])>>>0,hdr=JSON.parse(new TextDecoder().decode(pt.subarray(4,4+hl)));
  // Reihenfolge im Paket: Foto, Gesamtmaske, dann die weiteren Bilder (Personen-Masken, See, leeres Hintergrundbild) wie im Kopf aufgeführt
  let o=4+hl;const teil=h=>{const b=pt.subarray(o,o+h.laenge);o+=h.laenge;return loadBytes(b,h.typ)};
  const foto=teil(hdr.foto),maske=teil(hdr.maske),weitere=(Array.isArray(hdr.weitere)?hdr.weitere:[]).map(h=>teil(h).then(im=>[h.name,im]));
  const [fb,mb,...w]=await Promise.all([foto,maske,...weitere]);return{bilder:[fb,mb],extra:Object.fromEntries(w)};}

// ---------- Ausstellungsmodus: Bildschirm wach halten, täglich 4:00 neu laden (die Adresse samt Schlüssel bleibt erhalten) ----------
let wake=null;
function keepAwake(){try{if(!wake&&navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>{wake=null;});}).catch(()=>{});}catch(e){}}
document.addEventListener('visibilitychange',keepAwake);addEventListener('pointerdown',keepAwake);setInterval(keepAwake,6e4);
if(DEV)canvas.addEventListener('click',()=>document.body.classList.toggle('clean'));else addEventListener('contextmenu',e=>e.preventDefault());
// Ohne ?dev=1: 3 Sekunden ruhig aufs Bild drücken blendet die Test-Leiste ein, nochmal 3 Sekunden blendet sie aus. Alle anderen Berührungen bleiben ohne Wirkung.
let devOn=DEV,pressT=0,pressX=0,pressY=0;
function setDev(on){devOn=on;document.body.classList.toggle('dev',on);document.body.classList.remove('clean');if(on&&started){initDev();setBtns();}}
if(!DEV){const stop=()=>{if(pressT){clearTimeout(pressT);pressT=0;}};
  canvas.addEventListener('pointerdown',e=>{stop();pressX=e.clientX;pressY=e.clientY;pressT=setTimeout(()=>{pressT=0;setDev(!devOn);},3000);});
  canvas.addEventListener('pointermove',e=>{if(pressT&&Math.hypot(e.clientX-pressX,e.clientY-pressY)>24)stop();});
  for(const ev of['pointerup','pointercancel','pointerleave'])canvas.addEventListener(ev,stop);addEventListener('blur',stop);}
const RELOAD={at:(()=>{const n=wall(nowT());let r=fromWall(n.getFullYear(),n.getMonth(),n.getDate(),4);if(r<=nowT())r=fromWall(n.getFullYear(),n.getMonth(),n.getDate()+1,4);return r;})()};
// location.reload() lädt dieselbe Adresse inklusive #k=… neu; geprüft wird vorher nur, ob die Seite erreichbar ist (sonst in 10 Minuten wieder)
function neuLaden(){RELOAD.at=nowT()+10*6e4;return fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(r=>{if(r.ok)location.reload();}).catch(()=>{});}
setInterval(()=>{if(nowT()>=RELOAD.at)neuLaden();},3e4);
// Ändert sich der Schlüssel in der Adresse (z. B. nachträglich eingetippt), die Seite neu laden
addEventListener('hashchange',()=>location.reload());

// ---------- Steuerung (nur ?dev=1) ----------
let draw=null,STATUS='',lastTxt='',lastDraw=0,fpsN=0,fpsT=0,fpsW=0;
function setBtns(){$('now').classList.toggle('on',!playing&&!T_SIM);$('play').classList.toggle('on',playing);$('play').textContent=playing?'Anhalten':'Zeitraffer';
  document.querySelectorAll('[data-wx]').forEach(b=>b.classList.toggle('on',b.dataset.wx===WX.mode));document.querySelectorAll('[data-tonne]').forEach(b=>b.classList.toggle('on',b.dataset.tonne===TONNE_DEMO));}
function readout(L,ts){const d=L.d,ds=d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}),tm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  const cel=[];cel.push('Sonne '+(+L.alt.toFixed(1))+'°, Aufgang '+fmtHM(L.ST.rise)+', Untergang '+fmtHM(L.ST.set)+(L.sunUp?' (Tag)':' (Nacht)'));{const m=moonPos(curT());cel.push('Mond '+(+m.alt.toFixed(1))+'°, '+Math.round(moonFrac(curT())*100)+' % beleuchtet'+(m.alt>0?'':', unter dem Horizont'));}
  cel.push(wxText());cel.push(szeneText(ts));const cd=countdownJetzt(d);if(cd)cel.push('Countdown '+cd.c.name+': noch '+Math.ceil((1-cd.p)*15)+' von 15 Birnen');
  const tn=tonneJetzt(d);cel.push('Tonne: '+(tn?tn.t.name+(TONNE_DEMO?' (Vorschau)':tn.heute?' heute':' morgen'):'keine')+' · nächste: '+tonneText(d));
  if(STATUS)cel.push(STATUS);if(CFG_INFO)cel.push(CFG_INFO);if(T_SIM&&!playing)cel.push('Zeit simuliert');if(URL_INFO.length)cel.push(URL_INFO.join(', '));

  const txt=ds+', '+tm+' Uhr · '+ORT+'\n'+cel.join('\n');if(txt!==lastTxt){$('readout').textContent=txt;lastTxt=txt;}}
let LOOK=null;
function frame(now){requestAnimationFrame(frame);
  const dt=Math.min(0.1,(now-(frame.last||now))/1000);frame.last=now;if(playing)playT+=dt*1000*SPEED;
  const iv=1000/ANZ.max_fps;if(now-lastDraw<iv-4)return;lastDraw=now-lastDraw<2*iv?lastDraw+iv:now;
  const w0=performance.now();if(draw)draw(now);const work=performance.now()-w0;
  if(!devOn)return;
  fpsN++;fpsW+=work;if(now-fpsT>=1000){if(fpsT)$('fps').textContent=Math.round(fpsN*1000/(now-fpsT))+' Bilder/s (max. '+ANZ.max_fps+(ANZ_SRC.max_fps?', '+ANZ_SRC.max_fps:'')+') · '+(fpsW/fpsN).toFixed(1)+' ms\nRaster '+CP+' px je Zelle'+(ANZ_SRC.raster_px?' ('+ANZ_SRC.raster_px+')':' (auto)')+', Fuge '+GP+' px · '+COLS+'×'+ROWS+' Zellen · Figuren ×'+(+ZF.toFixed(2))+', Anzeige ×'+Z+'\nGerät '+innerWidth+'×'+innerHeight+' bei Pixeldichte '+(+(window.devicePixelRatio||1).toFixed(2));fpsN=0;fpsW=0;fpsT=now;}
  const T=curT(),d=wall(T);readout({d,alt:sunPos(T).alt,sunUp:(()=>{const s=sunTimes(d);return T>=s.rise&&T<=s.set})(),ST:sunTimes(d)},now/1000);}
function initDev(){if(initDev.done)return;initDev.done=true;

  document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{const ts=performance.now()/1000,nm=b.dataset.scene;
    if(nm==='night'){start('night',ts);return;}
    const T=curT(),L=lightAt(T,wall(T));if(!L.sunUp&&nm!=='ducks'){simAt(today(12,0,0));setBtns();}
    for(let i=EV.length-1;i>=0;i--)if(EV[i].type!=='ducks'&&nm!=='ducks')EV.splice(i,1);start(nm,ts);if(nm!=='ducks')nextGag=ts+SCN[nm].dur+lerp(SZENEN.min,SZENEN.max,Math.random())*60;});

}
window.__wd={get EV(){return EV},start,FAM,moonPos,moonFrac,RELOAD,neuLaden,curT,sunTimes,tonneJetzt,countdownJetzt,setDev,get status(){return STATUS},get draw(){return draw},get raster(){return{CP,GP,COLS,ROWS,Z,ZF}}};

// ---------- Start: Einstellungen, dann Wetter (gespeicherter Stand sofort) und Entschlüsseln parallel ----------
function startBild(res){if(started)return;started=true;urlAnzeige();fit();
  if(res&&res.bilder){const [img,maskImg]=res.bilder,x=res.extra||{},p=im=>im?pixels(im,W,H):null;
    BILD={col:pixels(img,W*SS,H*SS),msk:pixels(maskImg,W,H),anna:p(x.anna),max:p(x.max),valerie:p(x.valerie),see:p(x.see),leer:p(x.leer)};draw=build(BILD);
    const fehlt=['anna','max','valerie','see','leer'].filter(k=>!x[k]);STATUS='Foto entschlüsselt'+(fehlt.length?' (ohne '+fehlt.join(', ')+')':'');}
  else{draw=leer();STATUS='Kein gültiger Schlüssel: '+(res&&res.fehler?res.fehler:'Foto bleibt verborgen')+'. Es bleibt beim leeren Raster.';console.warn(STATUS);}
  if(devOn){initDev();setBtns();}keepAwake();requestAnimationFrame(frame);}

  return entschluesseln().catch(e=>({fehler:e.message}));}
